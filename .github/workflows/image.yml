name: image

# Builds the prebuilt image, then PROVES it boots: the container is started and
# the UI is polled until it answers. A green build that never ran the container
# would only prove the Dockerfile parses.
#
# This is also the only real Linux check this deployment gets before a pod: the
# development machine is Windows with no Docker and no NVIDIA GPU. GitHub's
# ubuntu runner has Docker, so `docker build` and `docker run` here are the
# first honest test of the image, of `rigma up --host 0.0.0.0`, and of the
# committed UI bundle being served from an installed wheel rather than a source
# tree. It cannot test the GPU: the runner has no NVIDIA device, so the Vulkan
# ICD question is still answered on a real pod (see the README).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rigma_spec:
        description: "PEP 508 spec for Rigma to install"
        required: false
        default: "rigma[nvidia]==0.12.2"
      install_vllm:
        description: "1 to install vLLM - the CUDA lane. A v*-cuda tag forces it."
        required: false
        default: "0"

permissions:
  contents: read
  packages: write

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The Runpod PyTorch base is ~8 GB and the runner's root volume is
        # tight; removing the preinstalled Android/.NET/GHC toolchains is the
        # documented way to make room, and none of them are used here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build the image
        # The spec comes from the TAG on a tag build, never from a hardcoded
        # fallback: a v0.12.x tag must install rigma==0.12.x, or the image lies
        # about what it is. That fallback is exactly how the first :0.12.1 image
        # shipped with rigma 0.12.0 inside it - a tag build passes no
        # workflow_dispatch input, so `inputs.rigma_spec || '<hardcoded>'`
        # silently took the hardcoded default. A branch build uses the
        # Dockerfile's ARG default, so the version lives in one place, and a
        # dispatch can still override for an unreleased spec.
        run: |
          SPEC="${{ github.event.inputs.rigma_spec }}"
          VLLM="${{ github.event.inputs.install_vllm }}"
          [ -z "$VLLM" ] && VLLM=0
          # A `v<version>-cuda` tag is the CUDA variant of that same release:
          # identical Rigma, vLLM added. The suffix is stripped before it
          # becomes a spec, because `rigma==0.12.2-cuda` is not a version.
          case "$GITHUB_REF_NAME" in *-cuda) VLLM=1 ;; esac
          if [ -z "$SPEC" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%-cuda}"
                            SPEC="rigma[nvidia]==$BASE" ;;
              *) SPEC="$(grep -oP '^ARG RIGMA_SPEC=\K.*' Dockerfile)" ;;
            esac
          fi
          echo "installing: $SPEC   (vllm=$VLLM)"
          echo "SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "INSTALL_VLLM=$VLLM" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          docker build \
            --build-arg "RIGMA_SPEC=$SPEC" \
            --build-arg "INSTALL_VLLM=$VLLM" \
            -t rigma-runpod:test .

      - name: The image must carry the Rigma we meant to install
        # A green build that booted the wrong version is the failure this
        # workflow exists to prevent, and the boot step below cannot see it:
        # 0.12.0 and 0.12.1 serve the same UI. So ask the image itself.
        run: |
          have="$(docker run --rm --entrypoint python3 rigma-runpod:test \
                    -c 'import rigma; print(rigma.__version__)')"
          echo "spec: $SPEC / installed: rigma $have"
          echo "HAVE=$have" >> "$GITHUB_ENV"
          case "$SPEC" in
            *"=="*)
              case "$SPEC" in
                *"==$have"*) echo "the image carries rigma $have" ;;
                *) echo "::error::image has rigma $have but the spec said $SPEC"
                   exit 1 ;;
              esac ;;
            *) echo "unpinned spec - skipping the version assertion" ;;
          esac

      - name: The CUDA lane must really be in there
        # An `INSTALL_VLLM=1` that silently installed nothing gives a green
        # image whose pod then dies with "vLLM is not installed". Ask the image,
        # the same way the Rigma version is asked.
        if: env.INSTALL_VLLM == '1'
        run: |
          docker run --rm --entrypoint python3 rigma-runpod:test -c \
            'import vllm, torch; print("vllm", vllm.__version__, "| torch", torch.__version__, "| cuda", torch.version.cuda)'

      - name: Boot it and prove the UI answers on the proxy port
        run: |
          set -x
          docker run -d --name rigma -p 11500:11500 \
            -e RIGMA_UI_PORT=11500 \
            -e RIGMA_HOST=0.0.0.0 \
            -e RIGMA_RUNPOD_BACKEND=cpu \
            -e RIGMA_AUTO_CALIBRATE=0 \
            rigma-runpod:test
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11500/ -o /tmp/index.html; then ok=1; break; fi
            sleep 5
          done
          echo "--- container log (tail) ---"
          docker logs rigma 2>&1 | tee /tmp/container.log | tail -60
          # The version the RUNNING server reports, not just the one on disk.
          # start.sh prints it precisely so a pod log can settle "which release
          # is this pod actually on", which is the question that cost two
          # deploys. If that line ever stops appearing, this fails.
          grep -q "Rigma version: $HAVE" /tmp/container.log \
            || { echo "::error::the running server does not report rigma $HAVE"; exit 1; }
          if [ "$ok" != "1" ]; then
            echo "::error::the UI never answered on 127.0.0.1:11500"
            exit 1
          fi
          echo "--- served HTML (head) ---"
          head -c 400 /tmp/index.html
          grep -qi 'id="root"' /tmp/index.html \
            || { echo "::error::the response is not Rigma's UI bundle"; exit 1; }
          echo "the installed wheel served the committed UI bundle"

          # The Runpod case, exactly. Its edge rewrites Host to the pod's own
          # CGNAT address, and that is NOT the address the connection arrived
          # on - here it arrives on 127.0.0.1. Rigma 0.12.1 refused this on a
          # live pod while the pod's own log showed the release was deployed,
          # because it compared Host against scope["server"]; 0.12.2 admits a
          # private literal on the Host alone. Every earlier version of this
          # workflow passed while the real deployment 403'd, so this is the
          # assertion that was missing.
          curl -fsS -H "Host: 100.65.31.217:11500" http://127.0.0.1:11500/ \
            -o /tmp/proxy.html \
            || { echo "::error::a proxy that rewrites Host to a CGNAT address was refused"; exit 1; }
          grep -qi 'id="root"' /tmp/proxy.html \
            || { echo "::error::the proxied response is not Rigma's UI bundle"; exit 1; }
          echo "a rewritten Host is admitted - the shape Runpod's edge sends"

          # ...and the guard still does its job: an attacker's NAME is refused
          # even when it is the Host the proxy would have set.
          code="$(curl -s -o /dev/null -w '%{http_code}' \
                    -H "Host: rigma.evil.example" http://127.0.0.1:11500/)"
          [ "$code" = "403" ] \
            || { echo "::error::a rebound name got $code, expected 403"; exit 1; }
          echo "a rebound name is still refused with 403"

      - name: Container log
        if: always()
        run: docker logs rigma 2>&1 | tail -100 || true

      - name: Push to GHCR (tags only)
        # Runs only on a v* tag, so a branch push can never publish an image.
        # GITHUB_TOKEN is enough; no extra secret. The package inherits this
        # repo's visibility, which is public, so a pod can pull it with no
        # registry credentials.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${{ github.repository }}"
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          VERSION="${IMAGE_TAG}"
          docker tag rigma-runpod:test "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          # :latest stays on the default image. A CUDA variant must not become
          # the thing a bare `:latest` pod silently gets.
          case "$VERSION" in
            *-cuda) echo "pushed $IMAGE:$VERSION (CUDA variant; :latest untouched)" \
                      >> "$GITHUB_STEP_SUMMARY" ;;
            *) docker tag rigma-runpod:test "$IMAGE:latest"
               docker push "$IMAGE:latest"
               echo "pushed $IMAGE:$VERSION and $IMAGE:latest" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
